[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tablescan-local"
version = "1.0.3"
description = "Offline desktop OCR for handwritten laboratory tables"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "TableScan Local contributors" }]
dependencies = [
  "certifi>=2026.7.22",
  "PySide6>=6.8,<7",
  "numpy>=2,<3",
  "opencv-python>=4.10,<6",
  "Pillow>=11,<13",
  "pypdfium2>=4.30,<6",
  "openpyxl>=3.1,<4",
  "rapidocr-onnxruntime>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-qt>=4.4,<5",
  "pyinstaller>=6.10,<7",
]

[project.scripts]
tablescan-local = "tablescan_local.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tablescan_local = ["slow_runner.py", "models/*.onnx", "models/*.txt", "models/*.md", "assets/*.png", "assets/*.icns", "assets/*.ico", "translations/*.json", "translations/*.qm", "default_templates/*.json", "default_templates/*.pdf", "default_templates/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
