name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload to
        required: true
        type: string
      sign_macos:
        description: Sign and notarize macOS packages with Developer ID (requires Apple secrets)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -c packaging/constraints.txt -e ".[dev]"
      - name: Test on Linux
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen pytest
      - name: Test on Windows or macOS
        if: runner.os != 'Linux'
        run: pytest
      - name: Configure macOS release signing
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.sign_macos
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python packaging/macos/setup_signing.py
      - run: pyinstaller --clean --noconfirm packaging/tablescan_local.spec
      - name: Verify packaged licenses and Qt plugins
        run: python packaging/verify_bundle.py dist
      - name: Notarize macOS release application
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.sign_macos
        run: python packaging/macos/notarize.py "dist/TableScan Local.app"
      - name: Test packaged application on Linux
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen dist/TableScanLocal/TableScanLocal --self-test
      - name: Test packaged application on macOS
        if: runner.os == 'macOS'
        run: '"dist/TableScan Local.app/Contents/MacOS/TableScanLocal" --self-test'
      - name: Test packaged application on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "dist\TableScanLocal\TableScanLocal.exe" --self-test'
      - name: Create Ubuntu packages
        if: runner.os == 'Linux'
        run: bash packaging/linux/make_packages.sh
      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          VERSION=$(python -c "from tablescan_local import __version__; print(__version__)")
          ARCH=$(uname -m)
          bash packaging/macos/make_dmg.sh "dist/TableScan Local.app" "TableScan-Local-${VERSION}-macOS-${ARCH}.dmg"
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\TableScanLocal.iss'
      - name: Save verified packages for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.sign_macos
        run: python packaging/macos/setup_signing.py --cleanup

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, windows-cpu-backend]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Publish only after all platform checks succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "FETCH_HEAD^{commit}")"
          python packaging/make_forms_archive.py
          VERSION="${RELEASE_TAG#v}"
          for FILE in release/*; do
            NAME="${FILE##*/}"
            if [[ "$NAME" != SHA256SUMS && "$NAME" != *"$VERSION"* ]]; then
              echo "Package version does not match $RELEASE_TAG: $NAME" >&2
              exit 1
            fi
          done
          (
            cd release
            shopt -s nullglob
            sha256sum -- *.dmg *.exe *.deb *.tar.gz *.AppImage *.zip > SHA256SUMS
          )
          gh release view "$RELEASE_TAG"
          for FILE in release/*; do
            uploaded=false
            for attempt in 1 2 3; do
              if timeout 10m env GODEBUG=http2client=0 gh release upload "$RELEASE_TAG" "$FILE" --clobber; then
                uploaded=true
                break
              fi
              sleep 10
            done
            if [[ "$uploaded" != true ]]; then
              echo "Upload failed after three attempts: $FILE" >&2
              exit 1
            fi
          done

  windows-cpu-backend:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.17.0 huggingface_hub==1.31.0 pillow==12.3.0
      - name: Exercise both multimodal architectures on Windows CPU
        run: python -X faulthandler packaging/smoke_torch_backend.py
      - name: Check full models when host memory and disk permit
        run: python -X faulthandler packaging/smoke_full_cpu.py
