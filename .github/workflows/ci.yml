name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload to
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install -e ".[dev]"
      - name: Test on Linux
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen pytest
      - name: Test on Windows or macOS
        if: runner.os != 'Linux'
        run: pytest
      - run: pyinstaller --clean --noconfirm packaging/tablescan_local.spec
      - name: Test packaged application on Linux
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen dist/TableScanLocal/TableScanLocal --self-test
      - name: Test packaged application on macOS
        if: runner.os == 'macOS'
        run: '"dist/TableScan Local.app/Contents/MacOS/TableScanLocal" --self-test'
      - name: Test packaged application on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "dist\TableScanLocal\TableScanLocal.exe" --self-test'
      - name: Create Ubuntu packages
        if: runner.os == 'Linux'
        run: bash packaging/linux/make_packages.sh
      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          VERSION=$(python -c "from tablescan_local import __version__; print(__version__)")
          ARCH=$(uname -m)
          bash packaging/macos/make_dmg.sh "dist/TableScan Local.app" "TableScan-Local-${VERSION}-macOS-${ARCH}.dmg"
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\TableScanLocal.iss'
      - name: Upload packages to release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release/* --clobber
